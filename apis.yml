aid: sioma
name: Sioma
description: SIOMA is a Colombian precision-agriculture (agtech) software platform for tropical
  crops such as oil palm, banana, and cacao. It helps plantations monitor field labor, track
  harvest and weighing (pesaje) operations with GPS, and make data-driven decisions to raise
  productivity. The product combines a mobile field-management app, GPS-based labor tracking,
  smart weighing hardware (Nukak, Sigma, Jaco, and Bascula-G scales), and Siomi, an AI assistant
  for agriculture. SIOMA is delivered as a customer web and mobile application and is backed by
  500 Global. No public API or developer program is currently published.
